 : les chevaliers français s’y enlisent sous les volées des archers anglais d’Henri V. Ne construisez pas dans la boue.`,en:`A freshly ploughed field, soaked by a night of rain: the French knights bogged down under the volleys of Henry V’s English archers. You cannot build in the mud.`}},{id:`verdun`,order:5,name:{fr:`Verdun`,en:`Verdun`},subtitle:{fr:`1916 · France`,en:`1916 · France`},cols:20,rows:12,theme:`night`,open:!0,terrain:[`####################`,`#..................#`,`#.......#..........#`,`#..#...........#...#`,`#..................#`,`#..........#.......#`,`S..................H`,`#......#...........#`,`#............#.....#`,`#...#..............#`,`#..................#`,`####################`],paths:[],waveCount:30,startGold:480,startLives:20,hpScale:1,roster:[g(`legionary`,1),g(`hussar`,2),g(`hoplite`,3),g(`knight`,5),g(`berserker`,6),g(`balloon`,8),g(`medic`,9),g(`ninja`,11),g(`truck`,13),g(`biplane`,15),g(`elephant`,18),g(`tank`,21)],unlocks:[`command`],seed:1916,lore:{fr:`Terrain ouvert, sans chemin tracé : c’est vous qui creusez les tranchées. Placez vos tours pour forcer l’ennemi à un long détour, sans jamais lui fermer complètement le passage.`,en:`Open ground with no set path: you dig the trenches. Place your towers to force the enemy into a long detour, but never seal the way completely.`}},{id:`stalingrad`,order:6,name:{fr:`Stalingrad`,en:`Stalingrad`},subtitle:{fr:`1942 · URSS`,en:`1942 · USSR`},cols:20,rows:12,theme:`snow`,terrain:[`xx.....x....xx....xx`,`......x...x.......x.`,`x.x.............x...`,`x.......x.......x..x`,`..x...............x.`,`x.x...x.....x....x..`,`....................`,`x..x.........x.x...x`,`..x.......x...x.....`,`x....x.........x...x`,`........x.....x.....`,`xx.x.....xx...x..xx.`],paths:[{id:`north-street`,group:`north`,waypoints:[[0,1],[4,1],[4,4],[9,4],[9,6],[19,6]]},{id:`south-street`,group:`south`,waypoints:[[0,10],[6,10],[6,7],[12,7],[12,6],[19,6]]},{id:`factory`,group:`top`,waypoints:[[8,0],[8,2],[14,2],[14,6],[19, `,"menu.howto":`Comment jouer`,"howto.title":`Comment jouer`,"howto.1":`Les ennemis suivent le chemin jusqu’à votre forteresse. Chaque ennemi qui passe vous coûte des vies ; à zéro, la partie est perdue.`,"howto.2":`Construisez des tours sur les cases libres avec votre or. Éliminer des ennemis et repousser des vagues rapporte de l’or ; une tour se revend à 70 %.`,"howto.3":`Chaque tour a trois niveaux puis deux spécialisations au choix. Monter de niveau change souvent d’époque : archers → arbalétriers → mousquetaires → Gatling ou fusiliers Lebel.`,"howto.4":`Perforant : réduit par l’armure. Explosif : réduit de moitié. Feu : ignore l’armure. Certains ennemis résistent ou craignent un type précis.`,"howto.5":`Les volants ne sont touchés que par les archers, la baliste, les fusées et le canon à eau. Les camouflés ne sont vus qu’à moitié portée, sauf près d’un radar.`,"howto.6":`Un poste de commandement renforce les tours voisines. Les sapeurs ralentissent, les pièges frappent au passage, l’artillerie a une portée minimale.`,"howto.7":`Appelez la vague suivante en avance pour un bonus d’or, ou lancez plusieurs vagues à la fois si vos défenses tiennent. Boss toutes les dix vagues.`,"howto.8":`À Verdun, il n’y a pas de chemin : vos tours dessinent le labyrinthe. Il est impossible de fermer complètement le passage.`,"menu.settings":`Réglages`,"menu.footer":`Tout ce que vous verrez a réellement existé. Aucun asset externe : chaque pixel et chaque son sont générés par le jeu.`,"menu.stars":`{stars} / {total} étoiles`,"maps.title":`Choisissez votre champ de bataille`,"maps.back":`Retour`,"maps.locked":`Gagnez la carte précédente pour débloquer`,"maps.difficulty":`Difficulté`,"maps.mode":`Mode`,"maps.mode.classic":`Campagne ({waves} vagues)`,"maps.mode.endless":`Infini`,"maps.endlessLocked":`Gagnez la carte pour débloquer le mode infini`,"maps.start":`Au combat`,"maps.bestWave":`Record infini : vague {wave}`,"maps.unlocks":`Victoire : débloque {towers}`,"maps.openHint":`Terra
